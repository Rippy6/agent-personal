[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-personal"
version = "0.2.0"
description = "完全自律AIエージェント — 自分で考え、判断し、行動するもう1人の人間"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "agent-personal contributors" },
]
keywords = ["ai", "agent", "autonomous", "llm", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.39.0"]
openai = ["openai>=1.0.0"]
all-brains = ["agent-personal[claude,openai]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]
all = ["agent-personal[all-brains,dev]"]

[project.scripts]
agent = "main:main"

[project.urls]
Homepage = "https://github.com/Rippy6/agent-personal"
Repository = "https://github.com/Rippy6/agent-personal"
Issues = "https://github.com/Rippy6/agent-personal/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S603", "S607"]  # subprocess calls are intentional in shell tool

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
